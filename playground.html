<main>
<header class="page-head">
  <div class="glow" style="width:520px;height:520px;background:rgba(158,130,254,.15);top:-200px;inset-inline-end:-160px"></div>
  <div class="wrap">
    <h1 class="h1 play-h1" data-t="play.title"></h1>
    <p class="lede page-lede" data-t="play.lede"></p>
  </div>
</header>

<section id="game" style="padding-top:0">
  <div class="wrap game">
    <div>
      <h2 class="h2" data-t="play.cards"></h2>
      <p class="lede" data-t="play.cards.lede"></p>
      <div class="filters decks" id="decks" role="toolbar" aria-label="Decks"></div>
      <div class="game-ctrl">
        <button class="btn btn-hot" id="draw"><span data-t="game.draw">Pull a card</span> <span aria-hidden="true">🃏</span></button>
        <a class="btn btn-ghost" id="answer" target="_blank" rel="noopener" hidden><span data-t="game.answer">Send me your answer</span> <span class="arrow">↗</span></a>
      </div>
      <p class="game-count" id="gameCount" aria-live="polite"></p>
    </div>
    <div class="deck" aria-live="polite">
      <div class="fan" aria-hidden="true">
        <span class="gcard back bk" style="--i:5;--c:var(--purple)"><i>♣</i></span>
        <span class="gcard back bk" style="--i:4;--c:var(--orange)"><i>♦</i></span>
        <span class="gcard back bk" style="--i:3;--c:var(--lilac)"><i>♠</i></span>
        <span class="gcard back bk" style="--i:2;--c:var(--pink)"><i>♥</i></span>
        <span class="gcard back bk" style="--i:1;--c:var(--purple)"><i>★</i></span>
      </div>
      <button class="gcard flip" id="topCard" aria-label="Pull a card">
        <span class="face front"><span class="mark-sm">دماغ عليا</span><span class="qm">?</span></span>
        <span class="face qface"><span class="qnum" id="qNum"></span><span class="qtext" id="qText"></span><span class="mark-sm">دماغ عليا</span></span>
      </button>
    </div>
  </div>
</section>

<section id="kotsheena" style="padding-top:0">
  <div class="wrap game">
    <div>
      <h2 class="h2" data-t="deck.title"></h2>
      <p class="lede" data-t="deck.lede"></p>
      <div class="game-ctrl">
        <button class="btn btn-hot" id="kDraw" type="button"><span data-t="deck.draw"></span></button>
        <button class="btn btn-ghost" id="kFlip" type="button" hidden><span data-t="deck.flip"></span></button>
      </div>
      <p class="game-count" id="kCount" aria-live="polite"></p>
      <div class="k-guide-wrap"><p class="mp-h" data-t="deck.guide"></p><div class="k-guide" id="kGuide" dir="rtl"></div></div>
      <a class="rec-wa k-order" target="_blank" rel="noopener" href="https://wa.me/201093592555?text=%D8%B9%D8%A7%D9%8A%D8%B2%20%D9%83%D9%88%D8%AA%D8%B4%D9%8A%D9%86%D8%A9%20%D8%AF%D9%85%D8%A7%D8%BA%20%D8%B9%D9%84%D9%8A%D8%A7%20%D9%85%D8%B7%D8%A8%D9%88%D8%B9%D8%A9%20%F0%9F%83%8F" data-t="deck.order"></a>
    </div>
    <div class="kdeck" aria-live="polite">
      <div class="kstage" id="kStage">
        <button class="kcard" id="kCard" type="button"><span class="kface" id="kFront"></span><span class="kface kface-b" id="kBack"></span></button>
      </div>
      <div class="knav">
        <button class="knav-btn" id="kPrev" type="button" data-ta="deck.prev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span class="knav-n" id="kNum" dir="ltr"></span>
        <button class="knav-btn" id="kNext" type="button" data-ta="deck.next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
  </div>
</section>

<section id="play-with" style="padding-top:0">
  <div class="wrap">
    <div class="head">
      <h2 class="h2" data-t="play.with.title"></h2>
      <p class="lede" data-t="play.with.lede"></p>
      <p class="offer-hint" data-t="offer.hint"></p>
    </div>
    <div class="duo">
      <div class="panel" id="xo">
        <h3 class="h3">XO</h3>
        <p class="bubble-msg" id="xoMsg" aria-live="polite"></p>
        <div class="xo-grid" id="xoGrid" dir="ltr"></div>
        <div class="panel-ctrl"><button class="btn btn-ghost" id="xoReset"><span data-t="play.again"></span></button><div class="score" id="xoScore"></div></div>
      </div>
      <div class="panel" id="ludo">
        <h3 class="h3" data-t="play.ludo.title"></h3>
        <p class="bubble-msg" id="ldMsg" aria-live="polite"></p>
        <div class="ld-board" id="ldBoard" dir="ltr"></div>
        <div class="panel-ctrl">
          <div class="die" id="ldDie" data-n="1" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <button class="btn btn-hot" id="ldRoll"><span data-t="play.roll"></span> 🎲</button>
          <button class="btn btn-ghost" id="ldReset"><span data-t="play.again"></span></button>
          <div class="ld-home" id="ldHome"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<div class="trick"><div class="wrap"><span class="trick-tag">note</span><p dir="auto" data-t="trick.2"></p></div></div>

<section class="play-duo" style="padding-top:0">
  <div class="wrap duo">
    <div class="panel">
      <h2 class="h3" data-t="play.sudoku.title"></h2>
      <p class="muted" data-t="play.sudoku.lede"></p>
      <div class="sudoku" id="sudoku" dir="ltr"></div>
      <div class="panel-ctrl">
        <button class="btn btn-hot" id="sudokuCheck"><span data-t="play.check"></span></button>
        <button class="btn btn-ghost" id="sudokuNew"><span data-t="play.new"></span></button>
        <span class="msg" id="sudokuMsg" aria-live="polite"></span>
      </div>
    </div>
    <div class="panel">
      <h2 class="h3" data-t="play.color.title"></h2>
      <p class="muted" data-t="play.color.lede"></p>
      <div class="palette" id="palette" role="toolbar" aria-label="Colours"></div>
      <div class="m-nav"><button type="button" id="mPrev" aria-label="Previous page"></button><span id="mPageLbl" aria-live="polite"></span><button type="button" id="mNext" aria-label="Next page"></button></div>
      <svg id="colorArt" class="color-art" viewBox="-196 -196 392 392" xmlns="http://www.w3.org/2000/svg" stroke="#1a1917" stroke-width="1.4" stroke-linejoin="round" role="img" aria-label="Colouring page"></svg>
      <div class="panel-ctrl">
        <button class="btn btn-ghost" id="colorReset"><span data-t="play.reset"></span></button>
        <button class="btn btn-ghost" id="colorSave"><span data-t="play.save"></span> <span>↓</span></button>
      </div>
    </div>
  </div>
</section>

<section id="design-notes" style="padding-top:0">
  <div class="wrap">
    <div class="head">
      <h2 class="h2" data-t="play.notes.title"></h2>
      <p class="lede" data-t="play.notes.lede"></p>
    </div>
    <div class="dnotes" id="dnotes"></div>
  </div>
</section>

<section id="lists" style="padding-top:0">
  <div class="wrap duo lists">
    <div>
      <h2 class="h2" data-t="rec.title"></h2>
      <p class="lede" data-t="rec.lede"></p>
      <div class="filters" id="listTabs" role="tablist"></div>
      <div class="my-picks" id="myPicks"></div>
    </div>
    <form class="paperpad rec-form" id="recForm" name="recommend">
      <input type="hidden" name="topic" id="recTopic">
      <p class="rec-q" id="recQ"></p>
      <textarea id="listText" name="pick" rows="7" required></textarea>
      <input class="rec-name" name="name" id="recName" autocomplete="name">
      <div class="rec-actions">
        <button class="btn btn-hot" type="submit"><span data-t="rec.send"></span></button>
      </div>
      <small id="listSaved" aria-live="polite"></small>
    </form>
  </div>
  <div class="wrap"><div class="shelf" id="picksShelf"></div></div>
</section>

<section id="stickers-sec" style="padding-top:0">
  <div class="wrap">
    <div class="head">
      <h2 class="h2" data-t="play.stickers.title"></h2>
      <p class="lede" data-t="play.stickers.lede"></p>
    </div>
    <div class="filters" id="stkCats" role="toolbar" aria-label="Sticker sets"></div>
    <div class="stickers" id="stickers"></div>
    <div class="more-row"><button class="btn btn-hot" id="stkAll"><span data-t="play.dlall"></span> <span>↓</span></button></div>
  </div>
</section>
